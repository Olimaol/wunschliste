<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#234536">
    <meta name="description" content="Ihr möchtet davon etwas übernehmen oder schenken? Dann bitte abhaken.">
    <!-- Link preview in WhatsApp and other apps; addresses must be complete -->
    <meta property="og:type" content="website">
    <meta property="og:locale" content="de_DE">
    <meta property="og:site_name" content="Wunschlisten">
    <meta property="og:title" content="Wunschliste für Fabi">
    <meta property="og:description" content="Ihr möchtet davon etwas übernehmen oder schenken? Dann bitte abhaken.">
    <meta property="og:url" content="https://olimaol.github.io/wunschliste/fabi.html">
    <meta property="og:image" content="https://olimaol.github.io/wunschliste/img/vorschau-fabi.jpg">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Geschenkanhänger an rot-weißem Garn: Für Fabi">
    <meta name="twitter:card" content="summary_large_image">
    <title>Wunschliste für Fabi</title>
    <link rel="icon" href="img/stern.svg" type="image/svg+xml">
    <link rel="stylesheet" href="wunschliste.css">
</head>
<body>
    <header class="page-head list-head">
        <a class="back" href="index.html">Alle Wunschlisten</a>
    </header>

    <!-- Gift tag with the name, hanging from the twine -->
    <div class="tags">
        <h1 class="tag"><span class="tag-for">Für</span> Fabi</h1>
    </div>

    <main class="sheet">
        <p>
            Ihr möchtet davon etwas übernehmen/schenken? Dann bitte abhaken:
        </p>
        <!-- data-list: name of this list in the Firebase database -->
        <div id="item-list" data-list="fabi_geschenke">
            <p class="message">Wunschliste wird geladen …</p>
        </div>
        <div class="unlock">
            <label for="unlock-switch">Falsches Häkchen gesetzt? Hier kann man gesetzte Häkchen kurzzeitig entsperren:</label>
            <!-- Switch (styled as a toggle button) -->
            <label class="switch">
                <input type="checkbox" id="unlock-switch">
                <span class="slider"></span>
            </label>
        </div>
    </main>

    <script type="module" src="wunschliste.js"></script>
</body>
</html>
