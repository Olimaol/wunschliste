<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Beide</title>
    <link rel="stylesheet" href="wunschliste.css">
</head>
<body>
    <h3><a href="index.html">Wunschlisten</a> > Beide</h3>
    <p>
        Ihr möchtet davon etwas übernehmen/schenken? Dann bitte abhaken:
    </p>
    <!-- data-list: name of this list in the Firebase database -->
    <div id="item-list" data-list="beide_geschenke">
        <p class="message">Wunschliste wird geladen …</p>
    </div>
    <p>
        Falsches Häkchen gesetzt? Hier kann man gesetzte Häkchen kurzzeitig entsperren:
        <!-- Switch (styled as a toggle button) -->
        <label class="switch">
            <input type="checkbox" id="unlock-switch">
            <span class="slider round"></span>
        </label>
    </p>

    <script type="module" src="wunschliste.js"></script>
</body>
</html>
